name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.x stores timestamps as datetime64[ns], 3.x as datetime64[us].
        # The rule layer must give identical results on both.
        pandas-version: ["2.2.3", "3.0.2"]
    name: pytest (pandas ${{ matrix.pandas-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pandas==${{ matrix.pandas-version }}"
      - name: Run tests
        run: python -m pytest tests/ -q

      # Catches anything that only works because a previous run left files
      # behind. The CI checkout has no outputs/ directory at all.
      - name: Pipeline runs from a clean checkout
        run: python src/run_pipeline.py
